    - generic [ref=e306]:
      - main [ref=e307]:
        - generic [ref=e309]:
          - heading "概述 Permalink to \"概述\"" [level=1] [ref=e310]:
            - text: 概述
            - link "Permalink to \"概述\"":
              - /url: "#概述"
          - paragraph [ref=e311]: CodeBuddy IDE 深度融合了设计、编码、调试与部署全流程，旨在通过高度自 动化的工作流，为开发者打造丝滑的 AI 协作体验。
          - heading "基础能力 Permalink to \"基础能力\"" [level=2] [ref=e312]:
            - text: 基础能力
            - link "Permalink to \"基础能力\"":
              - /url: "#基础能力"
          - paragraph [ref=e313]: CodeBuddy 覆盖了从创意萌芽到代码上线的全生命周期：
          - list [ref=e314]:
            - listitem [ref=e315]:
              - paragraph [ref=e316]:
                - strong [ref=e317]: 智能对话
                - text: ：即时技术咨询，支持多轮对话与复杂逻辑推导。
            - listitem [ref=e318]:
              - paragraph [ref=e319]:
                - strong [ref=e320]: 代码补全
                - text: ：毫秒级代码预测，深度适配项目私有风格。
            - listitem [ref=e321]:
              - paragraph [ref=e322]:
                - strong [ref=e323]: Figma 转代码
                - text: ：一键将 UI 设计稿转化为可维护的高质量前端代码。
            - listitem [ref=e324]:
              - paragraph [ref=e325]:
                - strong [ref=e326]: 组件库集成
                - text: ：预置企业级 UI 组件，支持自然语言调整样式与布局。
            - listitem [ref=e327]:
              - paragraph [ref=e328]:
                - strong [ref=e329]: 智能诊断
                - text: ：自动发现潜在 Bug 与性能瓶颈，提供一键修复方案。
          - heading "核心能力 Permalink to \"核心能力\"" [level=2] [ref=e330]:
            - text: 核心能力
            - link "Permalink to \"核心能力\"":
              - /url: "#核心能力"
          - paragraph [ref=e331]:
            - text: CodeBuddy 代码补全
            - strong [ref=e332]: Pro
            - text: ：引入
            - code [ref=e333]: NES
            - text: (Next Edit Suggestions) 前瞻式编辑能力，重新定义智能补全，
            - link "了解更多" [ref=e334] [cursor=pointer]:
              - /url: ./Completion
            - text: 。
          - paragraph [ref=e335]:
            - strong [ref=e336]: 核心亮点
            - text: ：超越光标，预见下一步
          - paragraph [ref=e337]:
            - text: 突破传统补全局限，
            - code [ref=e338]: NES
            - text: 不仅补全当前行，更能预测接下来的编码意图，自动对相关联的后续代码块（如下一行逻辑、函数体结尾）给出智能建议，真正实现 “写一补十” 的前瞻式体验。
          - paragraph [ref=e339]:
            - strong [ref=e340]: 无缝集成
            - text: ：默认开启，随心触发
          - paragraph [ref=e341]:
            - text: 功能默认开启，支持自动预判与手动触发双模式。手动触发快捷键：
            - code [ref=e342]: Ctrl + Shift + Enter
            - text: ", 一键召唤灵感，让编码行云流水。"
          - separator [ref=e343]
          - heading "快速开始 Permalink to \"快速开始\"" [level=2] [ref=e344]:
            - text: 快速开始
            - link "Permalink to \"快速开始\"":
