            - text: 基础交互
            - link "Permalink to \"基础交互\"":
              - /url: "#基础交互"
          - list [ref=e380]:
            - listitem [ref=e381]:
              - strong [ref=e382]: 新建会话
              - text: ：点击顶部的
              - code [ref=e383]: +
              - text: 图标。
            - listitem [ref=e384]:
              - strong [ref=e385]: 上下文引用
              - text: ：在输入框中输入
              - code [ref=e386]: "@"
              - text: 即可引用文件、文件夹或当前代码片段。
            - listitem [ref=e387]:
              - strong [ref=e388]: 多模态输入
              - text: ：支持直接粘贴截图或导入 Figma 链接进行 UI 开发。
          - heading "智能工作流 Permalink to \"智能工作流\"" [level=2] [ref=e389]:
            - text: 智能工作流
            - link "Permalink to \"智能工作流\"":
              - /url: "#智能工作流"
          - paragraph [ref=e390]: CodeBuddy 预置了多种专业模式，并支持自定义扩展，以适配不同的开发需求：
          - heading "1. 核心交互模式 Permalink to \"1. 核心交互模式\"" [level=3] [ref=e391]:
            - text: 1. 核心交互模式
            - link "Permalink to \"1. 核心交互模式\"":
              - /url: "#_1-核心交互模式"
          - list [ref=e392]:
            - listitem [ref=e393]:
              - paragraph [ref=e394]:
                - strong [ref=e395]: Ask (对话模式)
                - text: ：专注于技术问答与概念解释，不直接修改代码。适合快速获取思路或查阅 API。
            - listitem [ref=e396]:
              - paragraph [ref=e397]:
                - strong [ref=e398]: Craft (Agent模式)
                - text: ：专注于当前上下文的代码生成与局部修改。响应迅速，适合精准的函数编写或小范围重构。
            - listitem [ref=e399]:
              - paragraph [ref=e400]:
                - strong [ref=e401]: Plan (计划模式)
                - text: ：
                - strong [ref=e402]: 最强自动化模式
                - text: 。适用于跨文件修改或复杂功能开发。AI 会先制定任务清单（Plan），经您确认后自主执行读取、修改及环境检查。了解更多
                - link "Plan 模式" [ref=e403] [cursor=pointer]:
                  - /url: ./../Features/Plan-Mode
                - text: 。
          - heading "2. 自定义 Agent Permalink to \"2. 自定义 Agent\"" [level=3] [ref=e404]:
            - text: 2. 自定义 Agent
            - link "Permalink to \"2. 自定义 Agent\"":
              - /url: "#_2-自定义-agent"
          - paragraph [ref=e405]:
            - text: 除了预置模式，您还可以点击
            - strong [ref=e406]: 「+ 创建 Agent」
            - text: ，根据特定业务逻辑或工作习惯，定制专属的 AI 智能体，实现更高程度的流程自动化。了解更多
            - link "自定义 Agent" [ref=e407] [cursor=pointer]:
              - /url: ./../Features/Subagents
            - text: 。
          - heading "进阶特性 Permalink to \"进阶特性\"" [level=2] [ref=e408]:
            - text: 进阶特性
            - link "Permalink to \"进阶特性\"":
              - /url: "#进阶特性"
          - paragraph [ref=e409]: CodeBuddy 的强大之处在于其可配置与可扩展的“大脑”：
          - list [ref=e410]:
            - listitem [ref=e411]:
              - paragraph [ref=e412]:
                - strong [ref=e413]: Memory (记忆偏好)
                - text: ：自动记录您的偏好与项目关键背景，让 AI 随时间推移变得越来越精，更多参考
                - link "Memory" [ref=e414] [cursor=pointer]:
                  - /url: ./Memory
                - text: 。
            - listitem [ref=e415]:
              - paragraph [ref=e416]:
                - strong [ref=e417]: Rules (规则)
                - text: ：通过自定义
                - code [ref=e418]: .codebuddy/rules
                - text: ，强制 AI 遵循特定的架构设计或编码规范，更多参考
                - link "Rules" [ref=e419] [cursor=pointer]:
                  - /url: ./Rules
                - text: 。
            - listitem [ref=e420]:
              - paragraph [ref=e421]:
                - strong [ref=e422]: Skills (技能库)
                - text: ：通过用户/项目级配置
                - code [ref=e423]: .codebuddy/skills/
                - text: ", 针对特定场景（如安全审计、性能压测）封装的专业指令集，更多参考"
                - link "Skills" [ref=e424] [cursor=pointer]:
                  - /url: ./../Features/Skills
                - text: 。
            - listitem [ref=e425]:
              - paragraph [ref=e426]:
                - strong [ref=e427]: MCP (模型上下文协议)
                - text: ：开放协议，支持接入第三方工具（如数据库、实时搜索）作为 AI 的辅助工具，更多参考
                - link "MCP" [ref=e428] [cursor=pointer]:
                  - /url: ./MCP
                - text: 。
            - listitem [ref=e429]:
              - paragraph [ref=e430]:
                - strong [ref=e431]: 自定义模型（API接入）
                - text: ：支持自定义模型（API 接入），实现更丰富的 AI 能力，更多参考
                - link "Models" [ref=e432] [cursor=pointer]:
                  - /url: ./../Features/models
                - text: 。
            - listitem [ref=e433]:
              - paragraph [ref=e434]:
                - strong [ref=e435]: 自定义指令（个性化适配）
                - text: ：支持个性化开发习惯，让代码补全贴合个人 / 团队习惯与专属业务场景，更多参考
                - link "自定义指令" [ref=e436] [cursor=pointer]:
                  - /url: ./Slash-Commands#自定义斜杠指令
